name: Deploy Mediblix

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set Target Variables
        id: vars
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "ENV_NAME=prod" >> $GITHUB_OUTPUT
            echo "BACKEND_PORT=5050" >> $GITHUB_OUTPUT
            echo "PM2_NAME=mediblix-backend-prod" >> $GITHUB_OUTPUT
            echo "BACKEND_URL=https://backend.app.mediblix.com" >> $GITHUB_OUTPUT
            echo "FRONTEND_URL=https://app.mediblix.com" >> $GITHUB_OUTPUT
            echo "DEPLOY_DIR=/home/ubuntu/mediblix-prod" >> $GITHUB_OUTPUT
            echo "WEB_ROOT=/var/www/mediblix-prod/frontend/dist" >> $GITHUB_OUTPUT
          else
            echo "ENV_NAME=test" >> $GITHUB_OUTPUT
            echo "BACKEND_PORT=5051" >> $GITHUB_OUTPUT
            echo "PM2_NAME=mediblix-backend-test" >> $GITHUB_OUTPUT
            echo "BACKEND_URL=https://test.backend.app.mediblix.com" >> $GITHUB_OUTPUT
            echo "FRONTEND_URL=https://test.app.mediblix.com" >> $GITHUB_OUTPUT
            echo "DEPLOY_DIR=/home/ubuntu/mediblix-test" >> $GITHUB_OUTPUT
            echo "WEB_ROOT=/var/www/mediblix-test/frontend/dist" >> $GITHUB_OUTPUT
          fi

      - name: Install Frontend Dependencies
        run: |
          npm --prefix frontend install

      - name: Build Frontend Application
        run: |
          VITE_BACKEND_URL="${{ steps.vars.outputs.BACKEND_URL }}" npm --prefix frontend run build

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST || '13.207.109.182' }} >> ~/.ssh/known_hosts

      - name: Deploy Frontend Assets to Server
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER || 'ubuntu' }}@${{ secrets.SERVER_HOST || '13.207.109.182' }} "sudo mkdir -p ${{ steps.vars.outputs.WEB_ROOT }} && sudo chown -R ${{ secrets.SERVER_USER || 'ubuntu' }}:${{ secrets.SERVER_USER || 'ubuntu' }} ${{ steps.vars.outputs.WEB_ROOT }}"
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key" frontend/dist/ ${{ secrets.SERVER_USER || 'ubuntu' }}@${{ secrets.SERVER_HOST || '13.207.109.182' }}:${{ steps.vars.outputs.WEB_ROOT }}/

      - name: Deploy Backend Application
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER || 'ubuntu' }}@${{ secrets.SERVER_HOST || '13.207.109.182' }} "mkdir -p ${{ steps.vars.outputs.DEPLOY_DIR }}/backend"
          rsync -avz --delete --exclude 'node_modules' --exclude '.env' -e "ssh -i ~/.ssh/deploy_key" backend/ ${{ secrets.SERVER_USER || 'ubuntu' }}@${{ secrets.SERVER_HOST || '13.207.109.182' }}:${{ steps.vars.outputs.DEPLOY_DIR }}/backend/

      - name: Configure and Start Backend via PM2
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER || 'ubuntu' }}@${{ secrets.SERVER_HOST || '13.207.109.182' }} "bash -s" << 'EOF'
            set -e
            cd ${{ steps.vars.outputs.DEPLOY_DIR }}/backend

            cat << 'ENV_EOF' > .env
          PORT=${{ steps.vars.outputs.BACKEND_PORT }}
          NODE_ENV=production
          FRONTEND_URL=${{ steps.vars.outputs.FRONTEND_URL }}
          MONGODB_URI=${{ secrets.MONGODB_URI }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          ENV_EOF

            npm install --omit=dev

            if pm2 describe ${{ steps.vars.outputs.PM2_NAME }} > /dev/null 2>&1; then
              pm2 restart ${{ steps.vars.outputs.PM2_NAME }} --update-env
            else
              pm2 start index.js --name ${{ steps.vars.outputs.PM2_NAME }}
            fi

            pm2 save
            sudo systemctl reload nginx
          EOF

      - name: Verify Backend Health
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER || 'ubuntu' }}@${{ secrets.SERVER_HOST || '13.207.109.182' }} "curl -s -f http://127.0.0.1:${{ steps.vars.outputs.BACKEND_PORT }}/api/health || true"
